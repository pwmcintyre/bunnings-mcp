name: live
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0"
jobs:
  contract:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
